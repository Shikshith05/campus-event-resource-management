services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cerms
      POSTGRES_USER: cerms
      POSTGRES_PASSWORD: cerms
    ports:
      - "5432:5432"
    volumes:
      - cerms-postgres-data:/var/lib/postgresql/data
      - ./db/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/sql/views.sql:/docker-entrypoint-initdb.d/02-views.sql:ro
      - ./db/sql/booking_logic.sql:/docker-entrypoint-initdb.d/03-booking-logic.sql:ro
      - ./db/sql/analytics.sql:/docker-entrypoint-initdb.d/04-analytics.sql:ro
      - ./db/sql/procedures.sql:/docker-entrypoint-initdb.d/05-procedures.sql:ro
      - ./db/sql/seed.sql:/docker-entrypoint-initdb.d/06-seed.sql:ro
      - ./db/sql/rbac.sql:/docker-entrypoint-initdb.d/07-rbac.sql:ro

  mongodb:
    image: mongo:8
    # The scripts resolve db/mongo/... relative to the working directory, so
    # "docker compose exec mongodb mongosh cerms db/mongo/load.js" finds
    # /db/mongo/load.js.
    working_dir: /
    ports:
      - "27017:27017"
    volumes:
      - cerms-mongo-data:/data/db
      - ./db/mongo:/db/mongo:ro

volumes:
  cerms-postgres-data:
  cerms-mongo-data:
